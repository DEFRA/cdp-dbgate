services:
  mongo:
    image: mongo:7.0.28
    profiles: ["mongo"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./dev/mongo-seed.js:/docker-entrypoint-initdb.d/mongo-seed.js:ro

  redis:
    image: redis:7.2.3-alpine3.18
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  redis-seed:
    image: redis:7.2.3-alpine3.18
    profiles: ["redis"]
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/seed/redis-seed.sh"]
    volumes:
      - ./dev/redis-seed.sh:/seed/redis-seed.sh:ro
    restart: "no"

  # One shard, primary + replica, cluster mode: like CDP ElastiCache.
  redis-primary:
    image: redis:7.2.3-alpine3.18
    profiles: ["redis-cluster"]
    command: >-
      redis-server --cluster-enabled yes --cluster-announce-hostname redis-primary
      --cluster-preferred-endpoint-type hostname

  redis-replica:
    image: redis:7.2.3-alpine3.18
    profiles: ["redis-cluster"]
    command: >-
      redis-server --cluster-enabled yes --cluster-announce-hostname redis-replica
      --cluster-preferred-endpoint-type hostname

  redis-cluster-setup:
    image: redis:7.2.3-alpine3.18
    profiles: ["redis-cluster"]
    depends_on: [redis-primary, redis-replica]
    entrypoint: ["/bin/sh", "/seed/redis-cluster-setup.sh"]
    volumes:
      - ./dev/redis-cluster-setup.sh:/seed/redis-cluster-setup.sh:ro
    restart: "no"

  dbgate-mongo:
    build: .
    image: cdp-dbgate:local
    profiles: ["mongo"]
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      TOKEN: demo
      SERVICE: demo-service
      ENVIRONMENT: local
      USER_ID: local-user
      DBGATE_ENGINE: mongo
      URL_mongo: mongodb://mongo:27017/demo-service

  dbgate-redis:
    build: .
    image: cdp-dbgate:local
    profiles: ["redis"]
    depends_on:
      redis:
        condition: service_healthy
      redis-seed:
        condition: service_completed_successfully
    ports:
      - "8086:8085"
    environment:
      PORT: 8085
      TOKEN: demo
      SERVICE: demo-service
      ENVIRONMENT: local
      USER_ID: local-user
      DBGATE_ENGINE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"

  # Points at the replica, the case where DbGate's client gets MOVED.
  dbgate-redis-cluster:
    build: .
    image: ${DBGATE_IMAGE:-cdp-dbgate:local}
    profiles: ["redis-cluster"]
    depends_on:
      redis-cluster-setup:
        condition: service_completed_successfully
    ports:
      - "8087:8085"
    environment:
      PORT: 8085
      TOKEN: demo
      SERVICE: demo-service
      ENVIRONMENT: local
      USER_ID: local-user
      DBGATE_ENGINE: redis
      REDIS_HOST: redis-replica
      REDIS_PORT: 6379
      REDIS_TLS: "false"
